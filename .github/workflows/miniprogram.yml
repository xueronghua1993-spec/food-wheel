name: Check WeChat miniprogram
on:
  pull_request:
  push:
    branches: [main, feat/wechat-miniprogram]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: miniprogram-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test and build dependencies
        run: npm install --no-save --package-lock=false sharp@0.34.3 jsdom@26.1.0 @supabase/supabase-js@2.102.0 esbuild@0.25.10 miniprogram-compiler@0.2.3
      - name: Generate synchronized native resources
        run: |
          node scripts/build-miniprogram.cjs
          git diff --exit-code -- miniprogram/generated miniprogram/assets miniprogram/photos-a miniprogram/photos-b miniprogram/photos-c
      - name: Check native package and all logic
        run: |
          node scripts/check-miniprogram.cjs
          node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-miniprogram
          path: miniprogram/
