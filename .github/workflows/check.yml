name: Check menu and sharing
on:
  pull_request:
  push:
    branches: [feat/reset-menu-share-card]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install check and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --package-lock=false jsdom@26.1.0 sharp@0.34.3 playwright@1.56.1 @supabase/supabase-js@2.102.0 esbuild@0.25.10
      - name: Check calendar and todo logic
        run: node --test tests/*.test.mjs
      - name: Check menu behavior
        run: node scripts/check.cjs
      - name: Build share assets
        run: node scripts/build.cjs
      - name: Install cloud browser
        run: npx playwright install --with-deps chromium webkit
      - name: Check mobile layout and capture screenshots
        run: node scripts/browser-check.cjs
      - name: Check calendar todos in mobile browsers
        run: node scripts/check-todos.cjs
      - name: Check weather and online preview
        run: node scripts/check-weather.cjs
      - name: Check optional accounts and cloud synchronization (mocked backend)
        run: node scripts/check-account.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: food-wheel-preview
          path: public
