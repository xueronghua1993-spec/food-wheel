name: Check menu and sharing
on:
  pull_request:
  push:
    branches: [feat/reset-menu-share-card]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install check and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --package-lock=false jsdom@26.1.0 sharp@0.34.3
      - name: Check menu behavior
        run: node scripts/check.cjs
      - name: Build share assets
        run: node scripts/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: food-wheel-preview
          path: public
